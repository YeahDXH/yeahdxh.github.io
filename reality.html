<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>reality - DXH's Sample Website</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .passcode-box {
            margin-top: 20px;
        }
        .passcode-box label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
        }
        .passcode-box input[type="text"] {
            width: 300px;
            padding: 4px;
            border: 1px solid #000;
            font-size: 16px;
            outline: none;
            display: block;
            margin-bottom: 10px;
        }
        .passcode-box button {
            background-color: #00a2ff;
            color: #ffffff;
            border: none;
            padding: 4px 12px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header-star">
        <span class="line-1">DXH's</span>
        <span class="line-2">Sample Website</span>
    </div>

    <h1 class="page-title" style="color: red;">reality</h1>

    <div class="passcode-box">
        <label for="passcode">whats the passcode?</label>
        <input type="text" id="passcode" autocomplete="off">
        <button type="button" onclick="checkPasscode()">submit</button>
    </div>

    <div class="back-link">
        <a href="archives.html">&lt;- back</a>
    </div>

    <script>
        /*
          Passcode check updated to use a SHA-256 hash comparison instead of a plaintext string.
          IMPORTANT: This is only obfuscation on the client side and is NOT secure against a determined attacker.
          If you need a secret that must be kept private, verify the passcode on a server or serverless function instead.

          To compute the SHA-256 hash of your passcode in the browser console, paste the sha256hex function below and run:
            (async ()=>{ console.log(await sha256hex('your-passcode-here')) })()
        */

        // Replace this placeholder with the SHA-256 hex of your chosen passcode.
        const storedHash = 'REPLACE_WITH_SHA256_HEX';

        async function sha256hex(str) {
            const enc = new TextEncoder();
            const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPasscode() {
            const input = document.getElementById('passcode').value;
            const h = await sha256hex(input);
            if (h === storedHash) {
                // Access action - replace with what you want to happen on success.
                alert('Access Granted!');
            } else {
                alert('Incorrect passcode!');
            }
        }
    </script>
</body>
</html>
