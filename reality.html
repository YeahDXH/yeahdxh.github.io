<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>reality - DXH's Sample Website</title>
    <link rel="stylesheet" href="style.css">
    <script>
      if (location.hostname === 'yeahdxh.github.io') {
        window.location.replace('https://precious-gingersnap-a378a9.netlify.app/reality');
      }
    </script>
    <style>
        .passcode-box {
            margin-top: 20px;
        }
        .passcode-box label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
        }
        .passcode-box input[type="text"] {
            width: 300px;
            padding: 4px;
            border: 1px solid #000;
            font-size: 16px;
            outline: none;
            display: block;
            margin-bottom: 10px;
        }
        .passcode-box button {
            background-color: #00a2ff;
            color: #ffffff;
            border: none;
            padding: 4px 12px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header-star">
        <span class="line-1">DXH's</span>
        <span class="line-2">Sample Website</span>
    </div>

    <h1 class="page-title" style="color: red;">reality</h1>

    <div class="passcode-box">
        <label for="passcode">whats the passcode?</label>
        <input type="text" id="passcode" autocomplete="off">
        <button type="button" onclick="checkPasscode()">submit</button>
    </div>

    <div class="back-link">
        <a href="archives.html">&lt;- back</a>
    </div>

    <script>
        const netlifyFn = "https://yeahdxh.netlify.app/.netlify/functions/check-pass";

        async function checkPasscode() {
            const pass = document.getElementById('passcode').value;
            try {
                const res = await fetch(netlifyFn, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pass })
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        alert('Incorrect passcode!');
                        return;
                    }
                    alert('Error verifying passcode.');
                    return;
                }

                const data = await res.json();
                if (data.ok) {
                    alert('Access Granted!');
                } else {
                    alert('Incorrect passcode!');
                }
            } catch (err) {
                alert('Network or server error.');
            }
        }
    </script>
</body>
</html>
