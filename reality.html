<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>reality - DXH's Sample Website</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .passcode-box {
            margin-top: 20px;
        }
        .passcode-box label {
            font-size: 18px;
            display: block;
            margin-bottom: 8px;
        }
        .passcode-box input[type="text"] {
            width: 300px;
            padding: 4px;
            border: 1px solid #000;
            font-size: 16px;
            outline: none;
            display: block;
            margin-bottom: 10px;
        }
        .passcode-box button {
            background-color: #00a2ff;
            color: #ffffff;
            border: none;
            padding: 4px 12px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header-star">
        <span class="line-1">DXH's</span>
        <span class="line-2">Sample Website</span>
    </div>

    <h1 class="page-title" style="color: red;">reality</h1>

    <div class="passcode-box">
        <label for="passcode">whats the passcode?</label>
        <input type="text" id="passcode" autocomplete="off">
        <button type="button" onclick="checkPasscode()">submit</button>
    </div>

    <div class="back-link">
        <a href="archives.html">&lt;- back</a>
    </div>

    <script>
        /*
          This page now verifies the passcode on a Netlify Function so the secret is not exposed in the client files.
          Setup steps (Netlify):
            1) In your Netlify site dashboard, go to Site settings → Build & deploy → Environment → Environment variables.
            2) Add a variable named PASS_HASH with the SHA-256 hex of your passcode (do not commit this to the repo).
               Example to generate SHA-256 locally: node -e "const crypto=require('crypto'); console.log(crypto.createHash('sha256').update('your-pass','utf8').digest('hex'))"
            3) Deploy the site. The function endpoint will be available at /.netlify/functions/check-pass

          Security notes:
            - Using a serverless function prevents the plaintext passcode or its hash from appearing in client-side files.
            - For stronger protection against brute-force, use a slow hash like bcrypt on a server that supports it. This example uses SHA-256 for simplicity and to avoid adding extra dependencies.
        */

        async function checkPasscode() {
            const pass = document.getElementById('passcode').value;
            try {
                const res = await fetch('/.netlify/functions/check-pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pass })
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        alert('Incorrect passcode!');
                        return;
                    }
                    alert('Error verifying passcode.');
                    return;
                }

                const data = await res.json();
                if (data.ok) {
                    // Success action — replace or extend as needed.
                    alert('Access Granted!');
                } else {
                    alert('Incorrect passcode!');
                }
            } catch (err) {
                alert('Network or server error.');
            }
        }
    </script>
</body>
</html>
